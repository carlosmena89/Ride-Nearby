<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Ride Nearby · Set password</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./admin.css">
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <a class="admin-brand" href="./"><img src="./icon.svg" alt=""> <span>ride<span>nearby</span></span></a>
        <span class="admin-label">ACCOUNT SECURITY</span>
      </header>
      <section class="auth-card">
        <div class="section-kicker">PASSWORD RESET</div>
        <h1>Set a new password.</h1>
        <p>Choose a strong password for the private route dashboard.</p>
        <form id="reset-form" hidden>
          <label for="new-password">New password</label>
          <div class="login-fields">
            <input id="new-password" type="password" minlength="10" required autocomplete="new-password" placeholder="At least 10 characters">
            <input id="confirm-password" type="password" minlength="10" required autocomplete="new-password" placeholder="Repeat password">
            <button type="submit">Save password <span>↗</span></button>
          </div>
        </form>
        <p class="form-message" id="reset-message" role="status">Checking your recovery link…</p>
      </section>
    </main>
    <script src="./supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./reset-password.js" defer></script>
  </body>
</html>
